name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Criar esqueleto do projeto Flutter
        run: flutter create --org com.example --project-name chunktool flutter_project

      - name: Copiar codigo customizado (Dart)
        run: |
          rm -rf flutter_project/lib
          cp -r lib flutter_project/lib

      - name: Copiar codigo customizado (Kotlin)
        run: |
          KOTLIN_DIR=flutter_project/android/app/src/main/kotlin/com/example/chunktool
          cp android/NativeBridgePlugin.kt "$KOTLIN_DIR/"
          cp android/MainActivity.kt "$KOTLIN_DIR/MainActivity.kt"

      - name: Adicionar permissao no AndroidManifest
        run: |
          MANIFEST=flutter_project/android/app/src/main/AndroidManifest.xml
          sed -i 's#<manifest #<manifest xmlns:tools="http://schemas.android.com/tools" #' "$MANIFEST"
          sed -i 's#<application#<uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" tools:ignore="ScopedStorage" />\n    <application#' "$MANIFEST"

      - name: Build APK (debug)
        working-directory: flutter_project
        run: flutter build apk --debug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chunk-tool-apk
          path: flutter_project/build/app/outputs/flutter-apk/app-debug.apk
          
