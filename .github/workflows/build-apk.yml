name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.24.0'
          channel: 'stable'

      - name: Criar esqueleto do projeto Flutter
        run: flutter create --org com.example --project-name chunktool flutter_project

      - name: Copiar codigo customizado (Dart)
        run: |
          rm -rf flutter_project/lib
          cp -r lib flutter_project/lib

      - name: Copiar codigo customizado (Kotlin)
        run: |
          KOTLIN_DIR=flutter_project/android/app/src/main/kotlin/com/example/chunktool
          cp android/NativeBridgePlugin.kt "$KOTLIN_DIR/"
          cp android/MainActivity.kt "$KOTLIN_DIR/MainActivity.kt"
          cp android/ShizukuUserService.kt "$KOTLIN_DIR/"
          cp android/NativeLevelDB.kt "$KOTLIN_DIR/"
          cp android/ChunkScanner.kt "$KOTLIN_DIR/"
          cp android/LevelDatEditor.kt "$KOTLIN_DIR/"

      - name: Copiar interface AIDL do Shizuku
        run: |
          echo "--- Conteudo real de android/ (com caracteres especiais visiveis) ---"
          find android | cat -A
          echo "-----------------------------------------------------------------"
          mkdir -p flutter_project/android/app/src/main/aidl
          if [ -d android/aidl ]; then
            cp -r android/aidl/. flutter_project/android/app/src/main/aidl/
          else
            echo "ERRO: pasta android/aidl nao foi encontrada pelo shell."
            exit 1
          fi

      - name: Copiar codigo nativo C++ e clonar a leveldb (porte CMake)
        run: |
          CPP_DIR=flutter_project/android/app/src/main/cpp
          mkdir -p "$CPP_DIR"
          cp android/cpp/CMakeLists.txt "$CPP_DIR/"
          cp android/cpp/leveldb_jni.cpp "$CPP_DIR/"
          cp android/cpp/nbt_reader.h "$CPP_DIR/"
          cp android/cpp/subchunk_decoder.h "$CPP_DIR/"
          git clone --depth 1 https://github.com/teampathfinders/leveldb "$CPP_DIR/leveldb-mcpe"
          git -C "$CPP_DIR/leveldb-mcpe" submodule update --init --recursive || true
          echo "--- Substituindo port_posix_sse.cc por versao stub (so serve pra x86) ---"
          STUB_FILE="$CPP_DIR/leveldb-mcpe/src/port/port_posix_sse.cc"
          echo '#include <cstdint>' > "$STUB_FILE"
          echo '#include <cstddef>' >> "$STUB_FILE"
          echo 'namespace leveldb {' >> "$STUB_FILE"
          echo 'namespace port {' >> "$STUB_FILE"
          echo 'uint32_t AcceleratedCRC32C(uint32_t crc, const char* buf, size_t size) {' >> "$STUB_FILE"
          echo '    return 0;' >> "$STUB_FILE"
          echo '}' >> "$STUB_FILE"
          echo '}' >> "$STUB_FILE"
          echo '}' >> "$STUB_FILE"
          echo "--- Trocando funcoes _unlocked (nao existem no Android/Bionic) ---"
          sed -i \
            -e 's/fread_unlocked/fread/g' \
            -e 's/fwrite_unlocked/fwrite/g' \
            -e 's/fflush_unlocked/fflush/g' \
            "$CPP_DIR/leveldb-mcpe/src/util/env_posix.cc"
          echo "--- Cabecalhos disponiveis em leveldb-mcpe/include/leveldb ---"
          ls -la "$CPP_DIR/leveldb-mcpe/include/leveldb" || true
          echo "--- Conteudo de options.h (pra conferir nomes reais dos compressors) ---"
          cat "$CPP_DIR/leveldb-mcpe/include/leveldb/options.h" || true
          echo "--- CMakeLists.txt raiz da leveldb-mcpe (pra achar o nome real do target/lib) ---"
          cat "$CPP_DIR/leveldb-mcpe/CMakeLists.txt" || true
          echo "--- Procurando arquivos relacionados a compressor ---"
          find "$CPP_DIR/leveldb-mcpe" -iname "*compress*"
          echo "--- Conteudo de cada um encontrado ---"
          for f in $(find "$CPP_DIR/leveldb-mcpe" -iname "*compress*" -name "*.h"); do
            echo "=== $f ==="
            cat "$f"
          done

      - name: Adicionar dependencia do Shizuku e habilitar AIDL
        run: |
          cd flutter_project/android/app
          GRADLE_FILE=build.gradle.kts
          if [ ! -f "$GRADLE_FILE" ]; then GRADLE_FILE=build.gradle; fi
          echo "" >> "$GRADLE_FILE"
          echo "android {" >> "$GRADLE_FILE"
          echo "    buildFeatures {" >> "$GRADLE_FILE"
          if [ "$GRADLE_FILE" = "build.gradle.kts" ]; then
            echo "        aidl = true" >> "$GRADLE_FILE"
          else
            echo "        aidl true" >> "$GRADLE_FILE"
          fi
          echo "    }" >> "$GRADLE_FILE"
          echo "    defaultConfig {" >> "$GRADLE_FILE"
          if [ "$GRADLE_FILE" = "build.gradle.kts" ]; then
            echo "        minSdk = 24" >> "$GRADLE_FILE"
          else
            echo "        minSdkVersion 24" >> "$GRADLE_FILE"
          fi
          echo "        externalNativeBuild {" >> "$GRADLE_FILE"
          echo "            cmake {" >> "$GRADLE_FILE"
          if [ "$GRADLE_FILE" = "build.gradle.kts" ]; then
            echo "                abiFilters.addAll(listOf(\"arm64-v8a\", \"armeabi-v7a\"))" >> "$GRADLE_FILE"
          else
            echo "                abiFilters \"arm64-v8a\", \"armeabi-v7a\"" >> "$GRADLE_FILE"
          fi
          echo "            }" >> "$GRADLE_FILE"
          echo "        }" >> "$GRADLE_FILE"
          echo "    }" >> "$GRADLE_FILE"
          echo "    externalNativeBuild {" >> "$GRADLE_FILE"
          echo "        cmake {" >> "$GRADLE_FILE"
          if [ "$GRADLE_FILE" = "build.gradle.kts" ]; then
            echo "            path = file(\"src/main/cpp/CMakeLists.txt\")" >> "$GRADLE_FILE"
          else
            echo "            path \"src/main/cpp/CMakeLists.txt\"" >> "$GRADLE_FILE"
          fi
          echo "        }" >> "$GRADLE_FILE"
          echo "    }" >> "$GRADLE_FILE"
          echo "}" >> "$GRADLE_FILE"
          echo "" >> "$GRADLE_FILE"
          echo "dependencies {" >> "$GRADLE_FILE"
          if [ "$GRADLE_FILE" = "build.gradle.kts" ]; then
            echo "    implementation(\"dev.rikka.shizuku:api:13.1.5\")" >> "$GRADLE_FILE"
            echo "    implementation(\"dev.rikka.shizuku:provider:13.1.5\")" >> "$GRADLE_FILE"
            echo "    implementation(\"androidx.documentfile:documentfile:1.0.1\")" >> "$GRADLE_FILE"
          else
            echo "    implementation \"dev.rikka.shizuku:api:13.1.5\"" >> "$GRADLE_FILE"
            echo "    implementation \"dev.rikka.shizuku:provider:13.1.5\"" >> "$GRADLE_FILE"
            echo "    implementation \"androidx.documentfile:documentfile:1.0.1\"" >> "$GRADLE_FILE"
          fi
          echo "}" >> "$GRADLE_FILE"
          echo "--- Conteudo final do arquivo gradle do app ---"
          cat "$GRADLE_FILE"

      - name: Adicionar permissao e provider no AndroidManifest
        run: |
          MANIFEST=flutter_project/android/app/src/main/AndroidManifest.xml
          sed -i 's#<manifest #<manifest xmlns:tools="http://schemas.android.com/tools" #' "$MANIFEST"
          sed -i 's#<application#<uses-permission android:name="android.permission.MANAGE_EXTERNAL_STORAGE" tools:ignore="ScopedStorage" />\n    <application#' "$MANIFEST"
          sed -i 's#</application>#    <provider\n        android:name="rikka.shizuku.ShizukuProvider"\n        android:authorities="${applicationId}.shizuku"\n        android:multiprocess="false"\n        android:enabled="true"\n        android:exported="true"\n        android:permission="android.permission.INTERACT_ACROSS_USERS_FULL" />\n</application>#' "$MANIFEST"

      - name: Build APK (debug)
        working-directory: flutter_project
        run: flutter build apk --debug --verbose

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: chunk-tool-apk
          path: flutter_project/build/app/outputs/flutter-apk/app-debug.apk
          
